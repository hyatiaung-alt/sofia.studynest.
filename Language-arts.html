<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StudyNest - Language Arts</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
 
  <div class="top-bar">
    <button onclick="window.location.href='index.html'">&larr; Back</button>
    <span>Language Arts</span>
  </div>
 
  <div class="section">
    <div class="tab-row">
      <button class="tab active" onclick="showTab(this, 'la-english')">English</button>
      <button class="tab" onclick="showTab(this, 'la-spanish')">Spanish</button>
      <button class="tab" onclick="showTab(this, 'la-mandarin')">Mandarin</button>
    </div>
 
    <div id="la-english" class="tab-content active">
      <div class="cards-row">
        <div class="card" >
          <h4>Mr Chung&#39;s English Literacy 11 Notes</h4>
          <div class="card-bottom"><span class="price">$4.99</span><button class="btn small-btn">Preview & Buy</button></div>
        </div>
        <div class="card" >
          <h4>Mr. Kortschak&#39;s English Literacy 10 Notes</h4>
          <div class="card-bottom"><span class="price">$3.49</span><button class="btn small-btn">Preview & Buy</button></div>
        </div>
        <div class="card" >
          <h4>Mr. McMarry&#39;s English Literacy 12 Notes</h4>
          <div class="card-bottom"><span class="price">$2.99</span><button class="btn small-btn">Preview & Buy</button></div>
        </div>
      </div>
    </div>
 
    <div id="la-spanish" class="tab-content">
      <div class="cards-row">
        <div class="card" >
          <h4>Ms. S&#39;s Spanish Notes</h4>
          <div class="card-bottom"><span class="price">$3.99</span><button class="btn small-btn">Preview & Buy</button></div>
        </div>
      </div>
    </div>
 
    <div id="la-mandarin" class="tab-content">
      <div class="cards-row">
        <div class="card" >
          <h4>Ms. Chu&#39;s IB 8 and 9 Mandarin Notes</h4>
          <div class="card-bottom"><span class="price">$4.49</span><button class="btn small-btn">Preview & Buy</button></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function showTab(btn, id) {
      var parent = btn.parentElement.parentElement;
      parent.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      parent.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById(id).classList.add('active');
    }
  </script>
 
</body>
</html>
