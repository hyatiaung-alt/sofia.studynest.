<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StudyNest - Sciences</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
 
  <div class="top-bar">
    <button onclick="window.location.href='index.html'">&larr; Back</button>
    <span>Sciences</span>
  </div>
 
  <div class="section">
    <div class="tab-row">
      <button class="tab active" onclick="showTab(this, 'sci-chem')">Chemistry</button>
      <button class="tab" onclick="showTab(this, 'sci-phys')">Physics</button>
      <button class="tab" onclick="showTab(this, 'sci-bio')">Biology</button>
      <button class="tab" onclick="showTab(this, 'sci-env')">Env. Science</button>
    </div>
 
    <div id="sci-chem" class="tab-content active">
      <div class="cards-row">
        <div class="card">
          <h4>Ms. Chan&#39;s Chemistry 11 Notes</h4>
          <div class="card-bottom"><span class="price">$5.99</span><button class="btn small-btn">Preview & Buy</button></div>
        </div>
        <div class="card">
          <h4>Ms. Chan&#39;s Chemistry 12 Notes</h4>
          <div class="card-bottom"><span class="price">$3.99</span><button class="btn small-btn">Preview & Buy</button></div>
        </div>
      </div>
    </div>
 
    <div id="sci-phys" class="tab-content">
      <div class="cards-row">
        <div class="card">
          <h4>Mr Sheldon&#39;s Physics 12 Notes</h4>
          <div class="card-bottom"><span class="price">$4.49</span><button class="btn small-btn">Preview & Buy</button></div>
        </div>
      </div>
    </div>
 
    <div id="sci-bio" class="tab-content">
      <div class="cards-row">
        <div class="card">
          <h4>Mr Ing&#39;s Biology 11 Notes</h4>
          <div class="card-bottom"><span class="price">$4.99</span><button class="btn small-btn">Preview & Buy</button></div>
        </div>
      </div>
    </div>
 
    <div id="sci-env" class="tab-content">
      <div class="cards-row">
        <div class="card">
          <h4>Mr. Ing&#39;s Environmental Science 12 Notes</h4>
          <div class="card-bottom"><span class="price">$3.49</span><button class="btn small-btn">Preview & Buy</button></div>
        </div>
      </div>
    </div>
  </div>
 
  <script>
    function showTab(btn, id) {
      var parent = btn.parentElement.parentElement;
      parent.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      parent.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById(id).classList.add('active');
    }
  </script>
 
</body>
</html>
